name: Check public source tree
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python tools/check_public.py
