plugins { id 'com.android.application' }
android {
    namespace 'local.bnsm.savemanager'
    compileSdk 36
    defaultConfig { applicationId 'local.bnsm.savemanager'; minSdk 26; targetSdk 36; versionCode 6; versionName '1.5' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { sharedDebug { storeFile file(System.getenv('BNSM_TRIAL_KEYSTORE')); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildTypes { release { signingConfig signingConfigs.sharedDebug; minifyEnabled false } }
}
